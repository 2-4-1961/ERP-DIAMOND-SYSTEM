<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add Data Employee</title>
       <link rel="stylesheet" href="../bootstrap/css/bootstrap.css" />
    <link rel="stylesheet" href="../css/employee.css" />
    <link rel="stylesheet" href="../css/iframe.css" />
    <link rel="stylesheet" href="../css/site.css" />
  </head>
  <body class="bg-light">
    <div class="container-fluid w-75">
      <div class="header-bar">Add Data Employee</div>
      <!-- <span class="close">&times;</span> -->
      <span class="close" onclick="this.closest('.container-fluid').style.display='none';">&times;</span>

      <div class="row">
        <div class="col-lg-9">
          <div class="row lg-1">
            <div class="col-md-6">
              <label class="form-label">Employee NO</label>
              <input type="text" class="form-control" />
            </div>

            <div class="col-md-6">
              <label class="form-label">Employee Name</label>
              <input type="text" class="form-control" />
            </div>

            <div class="col-md-6">
              <label class="form-label">Join Date</label>
              <input type="date" class="form-control" />
            </div>

            <div class="col-md-6">
              <label class="form-label">Type of Job</label>
              <select class="form-select">
                <option>Owner</option>
                <option>Employee</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">ID Number</label>
              <input type="text" class="form-control" />
            </div>

            <div class="col-md-6">
              <label class="form-label">Salary</label>
              <input type="number" class="form-control" />
            </div>

            <div class="col-12">
              <label class="form-label">Address</label>
              <input type="text" class="form-control" />
            </div>

            <div class="col-md-6">
              <label class="form-label">Commission Rate</label>
              <input type="text" class="form-control" />
            </div>

            <div class="col-md-6">
              <label class="form-label">Job place</label>
              <select class="form-select">
                <option>30</option>
                <option>20</option>
              </select>
            </div>

            <div class="col-12">
              <label class="form-label">Notes</label>
              <textarea class="form-control" rows="2"></textarea>
            </div>
          </div>
        </div>
      </div>
      <div class="bottom-bar mt-2 d-flex justify-content-between align-items-center">
        <button class="btn btn-light fw-bold">Save</button>
        <button class="btn btn-light fw-bold">New Employee</button>
      </div>
      <div class="container bg-light d-flex align-items-center justify-content-center pt-4">
        <div><p>Copy © 2026 Dr.Mostafa Ali Eng.Seif Hosny Eng.Mohamed Amgad</p></div>
      </div>
    </div>

     <script src="../bootstrap/jquery-3.5.1.min.js"></script>
    <script src="../bootstrap/js/popper.min.js"></script>
    <script src="../bootstrap/js/bootstrap.js"></script>
  </body>
  </body>
</html>
